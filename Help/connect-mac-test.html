<body class="visual-help-prototype">
    <main class="visual-help-page">
        <section class="help-step" aria-labelledby="connect-mac-test">
            <h2 id="connect-mac-test">5. Test Connection</h2>
            <p>Open a text editor on your Mac.</p>
            <p>Press the Set &amp; Test button.</p>
            <p>Check that the following text appears in your editor:</p>
            <p class="help-test-string"><code>Hello World! ABC abc 123 456 aa BB 11 !! ?? -- ..</code></p>
            <figure class="help-placeholder">
                <figcaption>ESP Keyboard Test</figcaption>
            </figure>
        </section>
    </main>
