<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/help.css">
    <title>Allow Accessibility</title>
</head>
<body class="visual-help-prototype">
    <main class="visual-help-page">
        <section class="help-step" aria-labelledby="connect-mac-accessibility">
            <h2 id="connect-mac-accessibility">3. Allow Accessibility</h2>
            <p>ESPMacHelper needs Accessibility permission to send keyboard commands to your Mac.</p>
            <p>Open System Settings, find Accessibility, and enable ESPMacHelper.</p>
            <p>Open Show Status Window and check that Accessibility says Allowed.</p>
            <figure class="help-placeholder">
                <figcaption>macOS Accessibility Settings</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
