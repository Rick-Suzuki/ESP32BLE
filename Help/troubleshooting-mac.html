        <section class="help-step" aria-labelledby="troubleshooting-mac">
            <h2 id="troubleshooting-mac">4. Mac Not Connecting</h2>
            <p>Make sure ESPMacHelper is running and that your iPhone or iPad and Mac can communicate over the local network.</p>
            <p>Select Mac output mode, open the ESPMacHelper status window, and confirm its relevant macOS permissions.</p>
            <figure class="help-placeholder"><figcaption>ESPMacHelper status window</figcaption></figure>
        </section>
    </main>
