<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/help.css">
    <title>Install and Launch</title>
</head>
<body class="visual-help-prototype">
    <main class="visual-help-page">
        <section class="help-setup" aria-labelledby="connect-mac-setup">
            <h2 id="connect-mac-setup">2. Install and Launch</h2>
            <ol>
                <li>Download ESPMacHelper and move it to your Mac's Applications folder.</li>
                <li>Open ESPMacHelper.</li>
                <li>Look for the cyan E icon in the Mac menu bar.</li>
                <li>Click the icon and choose “Show Status Window”.</li>
            </ol>
            <figure class="help-setup-screenshot">
                <img src="images/espmac-helper-menu.png" alt="The cyan E icon in the Mac menu bar with the ESPMacHelper menu open, showing Show Status Window.">
            </figure>
            <p class="help-setup-note">ESPMacHelper starts automatically when opened.</p>
        </section>
    </main>
</body>
</html>
