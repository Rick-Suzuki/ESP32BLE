        <section class="help-step" aria-labelledby="troubleshooting-esp32-not-found">
            <h2 id="troubleshooting-esp32-not-found">1. ESP32 Not Found</h2>
            <p>Check that the ESP32 is connected to power and is running compatible firmware.</p>
            <p>Turn on Bluetooth on your iPhone or iPad, select ESP32 output mode, and look in ESP Settings. Do not look in iOS Bluetooth Settings.</p>
            <figure class="help-setup-screenshot">
                <img class="help-image help-image--screenshot" src="../images/5_Troubleshooting/troubleshooting-01.png" alt="ESP32 discovery in ESP Settings." data-planned-image="true">
            </figure>
        </section>
