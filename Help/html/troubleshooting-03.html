<body class="visual-help-prototype">
    <main class="visual-help-page">
        <section class="help-step" aria-labelledby="troubleshooting-keyboard">
            <h2 id="troubleshooting-keyboard">3. Keyboard Not Working</h2>
            <p>Confirm the active output mode and its connection. For ESP32 mode, check the ESP32 USB HID connection to the target device.</p>
            <p>Use Set &amp; Test with a text-entry field where appropriate. Mac mode sends output through ESPMacHelper instead of the ESP32 USB keyboard connection.</p>
            <figure class="help-setup-screenshot">
                <img class="help-image help-image--screenshot" src="../images/5_Troubleshooting/troubleshooting-03.png" alt="Keyboard test in ESP Settings." data-planned-image="true">
            </figure>
        </section>
    </main>
