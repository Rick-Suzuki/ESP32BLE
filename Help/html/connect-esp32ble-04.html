<body class="visual-help-prototype">
    <main class="visual-help-page">
        <section class="help-step" aria-labelledby="connect-esp32ble-test">
            <h2 id="connect-esp32ble-test">4. Test Keyboard</h2>
            <p>Open a text editor on the device connected to the ESP32-S3 USB keyboard port.</p>
            <p>Press Set &amp; Test in ESP Settings.</p>
            <p>Check that the following text appears:</p>
            <p><code>Hello World! ABC abc 123 456 aa BB 11 !! ?? -- ..</code></p>
            <figure class="help-setup-screenshot">
                <img class="help-image help-image--screenshot" src="../images/3_Connect_to_ESP32/connect-esp32ble-04-01.png" alt="ESP32 keyboard test." data-planned-image="true">
            </figure>
        </section>
    </main>
</body>
